name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: "main"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust + iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc -V; cargo -V

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch Info.plist (mic + background audio)
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 用于听歌识曲" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 用于听歌识曲" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -40

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update
        timeout-minutes: 45

      - name: Build iOS (unsigned, release)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=${GITHUB_RUN_NUMBER}
        timeout-minutes: 90

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/kanade-1.0.0-ios-unsigned.ipa Payload
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ios/Pods/Target\ Support\ Files/**
          if-no-files-found: ignore
