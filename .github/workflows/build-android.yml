name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: "main"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust + Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustc -V

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter pub get
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK (release, arm64)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name=1.0.0 \
            --build-number=${GITHUB_RUN_NUMBER}

      - name: Build APK (universal fallback)
        if: always()
        continue-on-error: true
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=${GITHUB_RUN_NUMBER}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/kanade-arm64.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/*.apk dist/ 2>/dev/null || true
          ls -lh dist/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: |
            android/.gradle/**
            build/app/outputs/logs/**
          if-no-files-found: ignore
